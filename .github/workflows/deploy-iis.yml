name: Deploy to IIS

# Runs on a self-hosted Windows runner installed ON the server (no WinRM/MSDeploy needed).
# The runner executes on the target Windows Server where IIS and PostgreSQL are installed.
#
# Required GitHub secret:
#   NONCASH_DB_CONNECTION  e.g. Host=localhost;Database=noncash;Username=noncash_app;Password=NonCashMachine@2026;SSL Mode=Require
#
# One-time server setup before this works:
#   1. Install the self-hosted runner: Settings -> Actions -> Runners -> New self-hosted runner (Windows).
#   2. Add a runner label "noncash-server" (or keep "self-hosted, windows").
#   3. Run .\config.cmd and .\run.cmd as a service.
#   4. Ensure the runner service account can access IIS (WebAdministration) and the DB.
#
# Production appsettings.json:
#   This workflow backs up and restores the server's production appsettings.json files
#   (C:\Projects\NonCashAPI\appsettings.json and C:\Projects\NonCashWeb\appsettings.json)
#   so that dotnet publish does not overwrite production secrets. Configure those files
#   once on the server; the workflow preserves them across deploys.
on:
  push:
    branches: [ main, master, deploy/* ]
  workflow_dispatch:

env:
  API_TARGET: C:\Projects\NonCashAPI
  WEB_TARGET: C:\Projects\NonCashWeb
  STAGE_ROOT: C:\Projects\_stage
  API_HEALTH_PATH: http://localhost:8668/health

jobs:
  build-test-publish-deploy:
    runs-on: [ self-hosted, windows ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET 9 SDK is pre-installed on the server; skip setup-dotnet to avoid
      # permission errors writing to C:\Program Files\dotnet under the runner service account.

      - name: Restore
        run: dotnet restore NonCash.sln

      - name: Build
        run: dotnet build NonCash.sln -c Release --no-restore

      - name: Test
        run: dotnet test NonCash.sln -c Release --no-build --verbosity minimal

      - name: Publish API
        run: dotnet publish src\NonCash.API\NonCash.API.csproj -c Release -o "$env:STAGE_ROOT\api" --no-build

      - name: Publish Web
        run: dotnet publish src\NonCash.Web\NonCash.Web.csproj -c Release -o "$env:STAGE_ROOT\web" --no-build

      - name: Stop NonCash IIS sites and app pools
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name nonCashAPI -ErrorAction SilentlyContinue
          Stop-WebAppPool nonCashAPI -ErrorAction SilentlyContinue
          Stop-Website -Name NonCashPlatform -ErrorAction SilentlyContinue
          Stop-WebAppPool NonCashPlatform -ErrorAction SilentlyContinue
          # Wait for worker processes to fully terminate and release file locks.
          Start-Sleep -Seconds 15
          Write-Host "NonCash sites/app pools stopped."

      - name: Backup production appsettings.json files
        shell: powershell
        run: |
          $targets = @($env:API_TARGET, $env:WEB_TARGET)
          foreach ($t in $targets) {
            $cfg = Join-Path $t 'appsettings.json'
            $bak = "$t`_appsettings.json"
            if (Test-Path $cfg) {
              Copy-Item $cfg $bak -Force
              Write-Host "Backed up $cfg"
            }
          }

      - name: Deploy to IIS folders (with rollback copy)
        shell: powershell
        run: |
          $stageApi  = Join-Path $env:STAGE_ROOT 'api'
          $stageWeb  = Join-Path $env:STAGE_ROOT 'web'
          $apiTarget = $env:API_TARGET
          $webTarget = $env:WEB_TARGET

          # Use robocopy with retries so locked files don't break the deploy.
          # /MIR = mirror (makes target identical to source)
          # /R:10 /W:5 = retry 10 times, wait 5 seconds between retries
          function Robocopy-Mirror($source, $destination) {
            if (-not (Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
            }
            $robocopy = Start-Process -FilePath robocopy -ArgumentList "`"$source`" `"$destination`" /MIR /R:10 /W:5 /NP /NFL /NDL" -Wait -PassThru -NoNewWindow
            if ($robocopy.ExitCode -ge 8) {
              throw "robocopy failed with exit code $($robocopy.ExitCode)"
            }
          }

          # API
          $apiPrev = "$apiTarget`_prev"
          if (Test-Path $apiPrev) { Remove-Item $apiPrev -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $apiTarget) {
            Robocopy-Mirror $apiTarget $apiPrev
          }
          Robocopy-Mirror $stageApi $apiTarget

          # Web
          $webPrev = "$webTarget`_prev"
          if (Test-Path $webPrev) { Remove-Item $webPrev -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $webTarget) {
            Robocopy-Mirror $webTarget $webPrev
          }
          Robocopy-Mirror $stageWeb $webTarget

          Remove-Item $env:STAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore production appsettings.json files
        shell: powershell
        run: |
          $targets = @($env:API_TARGET, $env:WEB_TARGET)
          foreach ($t in $targets) {
            $cfg = Join-Path $t 'appsettings.json'
            $bak = "$t`_appsettings.json"
            if (Test-Path $bak) {
              Copy-Item $bak $cfg -Force
              Write-Host "Restored $cfg"
            }
          }

      - name: Apply database migrations
        shell: powershell
        run: |
          dotnet tool install --global dotnet-ef 2>$null
          # Refresh PATH so the newly installed dotnet-ef global tool is found.
          $env:PATH = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          dotnet ef database update `
            --project src\NonCash.Infrastructure `
            --startup-project src\NonCash.API `
            --connection "${{ secrets.NONCASH_DB_CONNECTION }}"

      - name: Start NonCash IIS app pools and sites
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool nonCashAPI -ErrorAction SilentlyContinue
          Start-Website -Name nonCashAPI -ErrorAction SilentlyContinue
          Start-WebAppPool NonCashPlatform -ErrorAction SilentlyContinue
          Start-Website -Name NonCashPlatform -ErrorAction SilentlyContinue

      - name: Smoke test API health
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          try {
            $uri = $env:API_HEALTH_PATH
            $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 20
            Write-Host "API health: $($r.StatusCode)"
          } catch {
            Write-Warning "Health check failed for $uri; check app logs."
          }
