<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Voucher Transfer Received</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #7b1fa2; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Voucher(s) Received via Transfer</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{RecipientName}},</p>
            <p>You have received <strong>{{VoucherCount}}</strong> voucher(s) from <strong>{{SenderName}}</strong>.</p>
            <p style="color: #666;">Transferred on: {{TransferredAt}}</p>
            <p>You can view your vouchers by logging into your account or visiting the NonCash member portal.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
