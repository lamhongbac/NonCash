<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>A message about your gift</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #5e35b1; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">{{AuthorName}} sent you a message</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{RecipientName}},</p>
            <div style="background-color: #f5f5f5; border-radius: 6px; padding: 12px 16px; margin: 16px 0;">
                <p style="margin: 0;"><strong>{{VoucherName}}</strong></p>
                <p style="margin: 4px 0 0; color: #666;">Face value: {{FaceValue}}</p>
            </div>
            <div style="background-color: #ede7f6; border: 1px solid #d1c4e9; border-radius: 6px; padding: 12px 16px; margin: 16px 0;">
                <p style="margin: 0;">&ldquo;{{Body}}&rdquo;</p>
                <p style="margin: 6px 0 0; color: #666; font-size: 12px;">{{AuthorName}} &middot; {{SentAt}}</p>
            </div>
            <p>Reply under <strong>Gifts from friends</strong> or <strong>My Vouchers &rarr; Gifts you sent</strong> — the whole conversation is kept with the gift.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
