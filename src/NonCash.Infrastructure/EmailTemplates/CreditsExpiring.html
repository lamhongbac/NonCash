<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Credits Expiring Soon</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #d32f2f; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Credits Expiring Soon</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{BrandName}},</p>
            <p><strong>{{ExpiringCredits}}</strong> credit(s) in your NonCash account will expire in <strong>{{DaysLeft}}</strong> day(s), on <strong>{{ExpiresAt}}</strong>.</p>
            <p>Unused credits are forfeited at expiry. Please log in to review your balance and plan your voucher distributions.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
