<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Low Credit Balance</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #f57c00; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Low Credit Balance</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{BrandName}},</p>
            <p>Your NonCash credit balance is running low.</p>
            <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold; width: 140px;">Current Balance</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{CurrentBalance}}</td>
                </tr>
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold;">Warning Threshold</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{Threshold}}</td>
                </tr>
            </table>
            <p>Please top up soon to avoid interruptions in voucher distribution.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
