<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Credit Adjustment {{Outcome}}</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: {{HeaderColor}}; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Credit Adjustment {{Outcome}}</h2>
        </div>
        <div style="padding: 24px;">
            <p>Hello,</p>
            <p>Your credit adjustment request has been <strong>{{Outcome}}</strong>.</p>
            <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold; width: 140px;">Brand</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{BrandName}}</td>
                </tr>
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold;">Type</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{AdjustmentType}}</td>
                </tr>
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold;">Amount</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{Amount}}</td>
                </tr>
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold;">Request ID</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{RequestId}}</td>
                </tr>
            </table>
            {{ReviewNote}}
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
