<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>New Business Registration</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #1976d2; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">New Business Registration</h2>
        </div>
        <div style="padding: 24px;">
            <p>Hello,</p>
            <p>A new business registration has been submitted and is awaiting your review.</p>
            <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold; width: 140px;">Company</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{CompanyName}}</td>
                </tr>
                <tr>
                    <td style="padding: 8px; border: 1px solid #eee; font-weight: bold;">Request ID</td>
                    <td style="padding: 8px; border: 1px solid #eee;">{{RequestId}}</td>
                </tr>
            </table>
            <p>Please review it in the admin portal.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">NonCash Platform</p>
        </div>
    </div>
</body>
</html>
