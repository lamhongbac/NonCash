<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Credits Forfeited</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #d32f2f; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Credits Forfeited</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{BrandName}},</p>
            <p><strong>{{ForfeitedCredits}}</strong> credit(s) in your NonCash account expired on <strong>{{ExpiredAt}}</strong> and have been forfeited.</p>
            <p>Expired credits cannot be restored. Please plan your voucher distributions ahead of future expiry dates.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
