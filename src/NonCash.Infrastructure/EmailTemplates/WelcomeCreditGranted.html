<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Welcome Credits Granted</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #388e3c; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Welcome Credits Granted</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{BrandName}},</p>
            <p>Welcome to NonCash! Your brand has been granted <strong>{{CreditsGranted}}</strong> welcome credit(s).</p>
            <p>You can use these credits to create and distribute vouchers right away.</p>
            {{ExpiresAt}}
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
