<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Registration Received</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
        <div style="background-color: #1976d2; color: #fff; padding: 20px;">
            <h2 style="margin: 0;">Thank You for Registering</h2>
        </div>
        <div style="padding: 24px;">
            <p>Dear {{CompanyName}},</p>
            <p>Thank you for submitting your business registration with NonCash.</p>
            <p>Your request ID is: <strong>{{RequestId}}</strong></p>
            <p>We will review your application and notify you once it is approved.</p>
            <p style="margin-top: 24px; color: #666; font-size: 12px;">Best regards,<br/>NonCash Team</p>
        </div>
    </div>
</body>
</html>
